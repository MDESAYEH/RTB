name: FIBA sync

# Calls the site's own /api/cron/fiba endpoint, which pulls published FIBA data into the database.
# Inert until BOTH are configured in the repository settings:
#   variable  FIBA_SYNC_ENABLED = true   (set only after FIBA's permission/terms were reviewed)
#   secrets   SITE_URL (exact https origin), CRON_SECRET (same value as the app's CRON_SECRET)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: fiba-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.FIBA_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL" && test -n "$CRON_SECRET"
          code=$(curl -sS -m 90 -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/fiba")
          cat response.json; echo
          test "$code" = "200"
