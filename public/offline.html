<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8f1e1a">
<title>THE ROAD · دون اتصال</title>
<style>
  :root { --red: #8f1e1a; --ink: #023047; --gold: #f3a300; --soft: #547080; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px 16px;
    font-family: Almarai, Cairo, Tahoma, Arial, sans-serif;
    color: var(--ink);
    background: var(--red) url("/patterns/white-topo.svg") center / cover no-repeat;
    background-blend-mode: overlay;
  }
  main {
    width: min(100%, 520px);
    padding: 40px 32px 34px;
    text-align: center;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 24px 60px #0230472e;
  }
  .brand { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .brand img { width: 46px; height: 46px; }
  .brand b { font: 800 15px/1.2 Arial, sans-serif; letter-spacing: .16em; color: var(--red); }
  .badge {
    display: grid;
    place-items: center;
    width: 96px;
    height: 96px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: #fff4dc;
    color: var(--gold);
  }
  .badge svg { width: 46px; height: 46px; }
  h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.4; font-weight: 800; }
  h2 { margin: 0 0 20px; font: 700 15px/1.4 Arial, sans-serif; letter-spacing: .04em; color: var(--soft); }
  p { margin: 0; font-size: 16px; line-height: 1.9; color: #416b7e; }
  p.en { margin-top: 6px; font: 400 14px/1.7 Arial, sans-serif; color: var(--soft); direction: ltr; }
  .retry {
    display: inline-block;
    margin-top: 28px;
    padding: 14px 34px;
    text-decoration: none;
    border: 0;
    border-radius: 999px;
    background: var(--red);
    color: #fff;
    font: 800 16px/1 inherit;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 10px 24px #8f1e1a40;
  }
  .retry:hover { background: #a82622; }
  .retry:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .status { margin-top: 18px; font-size: 13px; color: var(--soft); min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="/logo.svg" alt="">
    <b>THE ROAD</b>
  </div>
  <div class="badge" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 2l20 20"/>
      <path d="M8.5 16.4a5 5 0 0 1 7 0"/>
      <path d="M5 12.9a10 10 0 0 1 5.2-2.7"/>
      <path d="M19 12.9a10 10 0 0 0-2.4-1.9"/>
      <path d="M2 8.8a15 15 0 0 1 4.2-2.6"/>
      <path d="M22 8.8a15 15 0 0 0-9.6-3.7"/>
      <path d="M12 20h.01"/>
    </svg>
  </div>
  <h1>أنت غير متصل</h1>
  <h2>YOU ARE OFFLINE</h2>
  <p>اتصل بالإنترنت لعرض النتائج المحدثة. لا نعرض نتائج مخزنة بوصفها مباشرة.</p>
  <p class="en">Connect to the internet to see the latest results. We never show stored results as live.</p>
  <a class="retry" href="/">إعادة المحاولة · Retry</a>
</main>
</body>
</html>
