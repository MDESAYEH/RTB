# /etc/nginx/sites-available/roadtobal27.ly  (ثم: ln -s إلى sites-enabled)
# الخطوة 1: شغّل هذا الملف كما هو (HTTP فقط) ثم نفّذ: certbot --nginx -d roadtobal27.ly -d www.roadtobal27.ly
# certbot يضيف إعدادات HTTPS ويعيد التوجيه تلقائيًا.

server {
    listen 80;
    listen [::]:80;
    server_name roadtobal27.ly www.roadtobal27.ly;

    client_max_body_size 6m;   # الصور حتى 5MB

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # يستبدل أي قيمة يرسلها العميل (مطلوب مع TRUST_PROXY_IP=1)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # البث المباشر SSE: بدون تخزين مؤقت
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
