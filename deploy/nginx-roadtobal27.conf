# /etc/nginx/sites-available/roadtobal27.ly  (ln -s إلى sites-enabled)
# النسخة المحصّنة بعد certbot. تأكد أن مسارات الشهادة تطابق ما أنشأه certbot عندك.
# حدود الطلبات (تُوضع في http { } عبر conf.d — هذا الملف يُضمَّن هناك تلقائياً لأنه في sites-enabled):
limit_req_zone $binary_remote_addr zone=rtb_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rtb_admin:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=rtb_conn:10m;

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name roadtobal27.ly www.roadtobal27.ly;
    return 301 https://roadtobal27.ly$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name roadtobal27.ly;

    ssl_certificate     /etc/letsencrypt/live/roadtobal27.ly/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roadtobal27.ly/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 6m;   # الصور حتى 5MB
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn rtb_conn 40;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # مزامنة FIBA تُستدعى محلياً من cron على 127.0.0.1:3091 فقط، لا حاجة لها من الإنترنت
    location = /api/cron/fiba { return 404; }

    # لوحة الإدارة: حد طلبات أشد
    location = /api/admin {
        limit_req zone=rtb_admin burst=10 nodelay;
        include /etc/nginx/snippets/roadtobal-proxy.conf;
    }
    location /api/media {
        limit_req zone=rtb_admin burst=20 nodelay;
        include /etc/nginx/snippets/roadtobal-proxy.conf;
    }

    # البث المباشر SSE: بدون تخزين مؤقت
    location = /api/live {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/roadtobal-proxy.conf;
    }

    location /api/ {
        limit_req zone=rtb_api burst=30 nodelay;
        include /etc/nginx/snippets/roadtobal-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/roadtobal-proxy.conf;
    }

    # لا ملفات مخفية
    location ~ /\. { deny all; }
}
